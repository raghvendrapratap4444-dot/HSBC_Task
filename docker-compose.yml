services:
  ml-api:
    build: ./ml-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-backend:
    build: ./python-backend
    ports:
      - "8001:8001"
    environment:
      ML_API_URL: http://ml-api:8000
    depends_on:
      ml-api:
        condition: service_healthy

  java-backend:
    build: ./java-backend
    ports:
      - "8080:8080"
    environment:
      ML_API_URL: http://ml-api:8000
    depends_on:
      ml-api:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_PYTHON_API_URL: http://localhost:8001
        NEXT_PUBLIC_JAVA_API_URL: http://localhost:8080
        NEXT_PUBLIC_ML_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_PYTHON_API_URL: http://localhost:8001
      NEXT_PUBLIC_JAVA_API_URL: http://localhost:8080
      NEXT_PUBLIC_ML_API_URL: http://localhost:8000
    depends_on:
      - python-backend
      - java-backend
